<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morfología Cabeza y Cuello</title><style>:root{--a:#0b6a6c;--d:#063e42;--p:#fff;--i:#12383a;--m:#456b6d;--l:#b9d8d3}*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:var(--i);background:#edf9f7}header{padding:18px 8%;background:var(--d);color:white}a{color:inherit}main{max-width:1000px;margin:auto;padding:35px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:22px;text-align:left}.card h2{color:var(--d)}button{background:var(--a);color:white;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:bold}.view{display:none}.view.active{display:block}.info{background:#d9f0ed;padding:14px;border-radius:10px;margin-top:12px}</style><header><a href="../index.html">← Odonto Salud W</a><h1>Morfología Cabeza y Cuello</h1></header><main><section id="home" class="view active"><p>Repaso de anatomía macroscópica y topográfica basado en tus apuntes de U/Morfo.</p><div class="grid"><button class="card" data-v="cat"><h2>Cátedra</h2><p>Regiones, nervios, irrigación, cavidad oral y anatomía dentaria.</p></button><button class="card" data-v="lab"><h2>Lab</h2><p>Identificación de cráneo, cara, regiones y estructuras.</p></button></div></section><section id="cat" class="view"><button data-home>← Volver</button><h2>Cátedra</h2><div class="grid" id="topics"></div></section><section id="lab" class="view"><button data-home>← Volver</button><h2>Lab</h2><div class="grid" id="labs"></div></section></main><script>const data={cat:[['Regiones topográficas','Occipitofrontal, temporal, mastoidea, nasal, labial, bucal, mentoniana, maseterina, submental, submaxilar e infrahioidea.'],['Nervio trigémino','V1 y V2 son sensitivos; V3 aporta sensibilidad y fibras motoras para músculos masticadores.'],['Nervio facial','Nervio principalmente motor de la mímica; sus ramas terminales se distribuyen en la cara.'],['Anatomía dentaria','Incisivos, caninos, premolares y molares se reconocen por corona, cúspides, raíces y función.']],lab:[['Cráneo y cara','Identifica frontal, parietal, temporal, occipital, esfenoides, maxilar, cigomático y mandíbula.'],['Región labial','Ordena piel, tejido subcutáneo, orbicular de los labios, glándulas labiales y mucosa.'],['Región bucal','Reconoce piel, bola adiposa de Bichat, buccinador, conducto de Stenon y glándulas molares.'],['Región gingivodentaria','Encía libre, adherida y papilar; surco gingival y cresta alveolar.']]};const $=x=>document.querySelector(x);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;$('#home').classList.remove('active');$('#'+v).classList.add('active');$('#'+(v==='cat'?'topics':'labs')).innerHTML=data[v].map(([h,p])=>`<article class="card"><h2>${h}</h2><button>Ver información</button><div class="info" hidden>${p}</div></article>`).join('');document.querySelectorAll('.card button').forEach(x=>x.onclick=()=>x.nextElementSibling.hidden=!x.nextElementSibling.hidden)});document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#home').classList.add('active')})</script></html>
