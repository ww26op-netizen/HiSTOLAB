:root{--ink:#12383a;--muted:#456b6d;--pink:#0b6a6c;--purple:#07585a;--line:#b9d8d3;--paper:#fff;--soft:#eef9f7;--page-a:#f2fbf9;--page-b:#dff2ef;--accent-soft:#d9f0ed}body[data-theme="dark"]{--ink:#d8f0ed;--muted:#aacbc7;--pink:#45aaa4;--purple:#8be0d8;--line:#356568;--paper:#123638;--soft:#1a4749;--page-a:#092629;--page-b:#123b3e;--accent-soft:#1d5052}body{background:linear-gradient(135deg,var(--page-a),var(--page-b))}header{background:linear-gradient(90deg,#063e42,#0b6a6c,#0a5254)}.brand span{color:#bcebe5}header small{color:#d5efeb}.theme-toggle{border:1px solid #a8d8d2;background:#ffffff1f;color:#fff;border-radius:10px;padding:8px 11px;font:inherit;font-weight:700;cursor:pointer}.theme-toggle:hover{background:#ffffff38}.back,.crumbs button{color:var(--pink)}.intro h1,.topic h2,.topic-head h2,.question h3,.summary h2{color:var(--purple)}.panel,.topic,.question{background:var(--paper)}.topic p,.intro p,.source,.crumbs,.review p{color:var(--muted)}button{border-color:var(--line);background:var(--soft);color:var(--purple)}button:hover{background:var(--accent-soft)}button.active,.primary{background:linear-gradient(135deg,var(--pink),#0a5254)}.study-card,.select-topic{background:var(--soft);border-color:var(--pink)}.study-card h3{color:var(--purple)}.feedback{background:var(--soft)}.summary{background:var(--accent-soft)}
</style></head><body><header><a class="brand" href="../index.html">Odonto <span>Salud W</span></a><small>Microbiología e Inmunología</small><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">🌙 Modo oscuro</button></header><main><a class="back" href="../index.html">← Volver a asignaturas</a><section class="intro"><h1>Microbiología e Inmunología</h1><p>Elige una sección y luego un tema. El contenido y el banco de preguntas proceden de los apuntes guardados en U/Micro.</p></section><div class="panel"><div id="app"></div></div></main><script src="data.js"></script><script>document.addEventListener("click",e=>{if(!e.target.matches("[data-info]"))return;const x=document.querySelector("#topic-info");if(x)x.hidden=!x.hidden});</script><script>
const app=document.querySelector('#app');let section='microbiologia',topicId=null,mode='practice',practiceIndex=0,answered=false,evaluation=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>microData[section].topics.find(t=>t.id===topicId);const tabs=()=>`<div class="tabs">${Object.entries(microData).map(([id,x])=>`<button class="${section===id?'active':''}" data-section="${id}">${x.label}</button>`).join('')}</div>`;
function home(){topicId=null;evaluation=null;const d=microData[section];app.innerHTML=`${tabs()}<p class="intro">${esc(d.description)}</p><div class="topic-grid">${d.topics.map(t=>`<button class="topic" data-topic="${t.id}"><h2>${esc(t.title)}</h2><p>${esc(t.source)}</p></button>`).join('')}</div>`;bind()}
function heading(){const t=current();return `${tabs()}<div class="crumbs"><button data-home>Temas</button> / ${esc(microData[section].label)}</div><div class="topic-head"><h2>${esc(t.title)}</h2><p class="source">Fuente: ${esc(t.source)}</p></div><div class="tabs"><button class="${mode==='study'?'active':''}" data-mode="study">Estudiar</button><button class="${mode==='practice'?'active':''}" data-mode="practice">Practicar</button><button class="${mode==='evaluate'?'active':''}" data-mode="evaluate">Evaluarme</button></div>`}
function render(){const t=current();let body=mode==='study'?t.study.map(([h,p])=>`<article class="study-card"><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join(''):mode==='practice'?practice(t):evaluate(t);app.innerHTML=heading()+body;bind()}
function practice(t){const x=t.questions[practiceIndex%t.questions.length];return `<div class="question"><p class="source">Pregunta ${practiceIndex+1} de ${t.questions.length}</p><h3>${esc(x.text)}</h3><div class="options">${x.options.map((o,i)=>`<button class="option" data-answer="${i}" ${answered?'disabled':''}><strong>${'ABCD'[i]}.</strong> ${esc(o)}</button>`).join('')}</div><button data-info type="button">ⓘ Ver información del tema</button><div class="feedback" id="topic-info" hidden><strong>${esc(t.title)}</strong>${t.study.map(([h,p])=>`<p><strong>${esc(h)}:</strong> ${esc(p)}</p>`).join('')}</div><div id="feedback"></div></div><div class="actions"><button data-next ${!answered?'disabled':''}>Siguiente pregunta →</button></div>`}
function evaluate(t){if(!evaluation){evaluation={questions:[...t.questions].sort(()=>Math.random()-.5),answers:[],index:0,finished:false}}if(evaluation.finished){const good=evaluation.answers.filter((a,i)=>a===evaluation.questions[i].answer).length,n=evaluation.questions.length;return `<div class="summary"><h2>Resultado: ${Math.round(good/n*100)}%</h2><p>${good} correctas · ${n-good} incorrectas · ${n} preguntas</p></div><h2>Revisión</h2>${evaluation.questions.map((q,i)=>`<article class="review"><h3>${evaluation.answers[i]===q.answer?'✓ Correcta':'✗ Incorrecta'} · ${esc(q.text)}</h3><p>Tu respuesta: ${esc(q.options[evaluation.answers[i]])}</p><p>Respuesta correcta: <strong>${esc(q.options[q.answer])}</strong></p><p>${esc(q.explanation)}</p></article>`).join('')}<div class="actions"><button class="primary" data-restart>Hacer otra evaluación</button></div>`}const q=evaluation.questions[evaluation.index];return `<div class="question"><p class="source">Examen de ${esc(t.title)} · Pregunta ${evaluation.index+1} de ${evaluation.questions.length}</p><h3>${esc(q.text)}</h3><div class="options">${q.options.map((o,i)=>`<button class="option" data-eval="${i}"><strong>${'ABCD'[i]}.</strong> ${esc(o)}</button>`).join('')}</div></div><div class="actions"><button class="primary" data-continue disabled>Continuar</button></div>`}function bind(){app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;home()});app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topicId=b.dataset.topic;practiceIndex=0;answered=false;mode='practice';render()});app.querySelector('[data-home]')?.addEventListener('click',home);app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;answered=false;render()});app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const x=current().questions[practiceIndex%current().questions.length],n=+b.dataset.answer,ok=n===x.answer;app.querySelectorAll('[data-answer]').forEach(z=>{z.disabled=true;if(+z.dataset.answer===x.answer)z.classList.add('correct');else if(z===b)z.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Correcta':'Incorrecta'}.</strong> ${esc(x.explanation)}</div>`;app.querySelector('[data-next]').disabled=false});app.querySelector('[data-next]')?.addEventListener('click',()=>{practiceIndex=(practiceIndex+1)%current().questions.length;answered=false;render()});app.querySelector('[data-start]')?.addEventListener('click',()=>{const ids=[...app.querySelectorAll('input:checked')].map(x=>x.value),questions=microData[section].topics.filter(t=>ids.includes(t.id)).flatMap(t=>t.questions);if(questions.length){evaluation={questions:questions.sort(()=>Math.random()-.5),answers:[],index:0,finished:false};render()}});app.querySelectorAll('[data-eval]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-eval]').forEach(z=>z.classList.remove('active'));b.classList.add('active');const c=app.querySelector('[data-continue]');c.disabled=false;c.dataset.answer=b.dataset.eval});app.querySelector('[data-continue]')?.addEventListener('click',e=>{evaluation.answers.push(+e.currentTarget.dataset.answer);evaluation.index++;if(evaluation.index>=evaluation.questions.length)evaluation.finished=true;render()});app.querySelector('[data-restart]')?.addEventListener('click',()=>{evaluation=null;render()})}home();
</script><script>const themeButton=document.querySelector('#theme-toggle'),themeKey='odonto-theme';function setTheme(theme){document.body.dataset.theme=theme;themeButton.textContent=theme==='dark'?'☀️ Modo claro':'🌙 Modo oscuro';themeButton.setAttribute('aria-pressed',theme==='dark')}setTheme(localStorage.getItem(themeKey)||'light');themeButton.addEventListener('click',()=>{const theme=document.body.dataset.theme==='dark'?'light':'dark';localStorage.setItem(themeKey,theme);setTheme(theme)});</script></body></html>
